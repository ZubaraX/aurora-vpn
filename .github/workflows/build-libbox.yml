name: Build libbox

# Builds the sing-box Android core (libbox.aar) via gomobile. Run manually.
# The resulting artifact is dropped into android/app/libs to give the Android
# VpnService a real proxy engine. Pinned to the same sing-box version as the
# Windows core so generated configs stay compatible.
on:
  workflow_dispatch:
    inputs:
      singbox_ref:
        description: sing-box git ref (tag)
        default: v1.13.14
      target_arch:
        description: Android architecture to build
        type: choice
        options:
          - arm64
          - amd64
        default: arm64

jobs:
  libbox:
    runs-on: ubuntu-latest
    # Pass the (untrusted) dispatch input through the environment instead of
    # interpolating it straight into shell commands — avoids script injection.
    env:
      SINGBOX_REF: ${{ github.event.inputs.singbox_ref || 'v1.13.14' }}
      TARGET_ARCH: ${{ github.event.inputs.target_arch || 'arm64' }}
    steps:
      - name: Clone sing-box
        run: git clone --depth 1 -b "$SINGBOX_REF" https://github.com/SagerNet/sing-box.git

      - name: Detect Go version
        id: go
        run: echo "version=$(grep -m1 '^go ' sing-box/go.mod | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: sing-box/go.sum

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install gomobile
        working-directory: sing-box
        run: make lib_install

      # Build libbox directly (not `make lib_android`) so we can drop the
      # `with_naive_outbound` tag — it pulls in a prebuilt libcronet.a that the
      # NDK linker rejects (unknown relocation 315). We don't use the naive
      # outbound, nor tailscale, so excluding them removes the problem entirely.
      - name: Build libbox.aar
        working-directory: sing-box
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile bind -v \
            -target="android/$TARGET_ARCH" \
            -androidapi 24 \
            -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=$SINGBOX_REF -checklinkname=0 -s -w" \
            -o libbox.aar \
            ./experimental/libbox
          ls -la libbox.aar

      - uses: actions/upload-artifact@v4
        with:
          name: libbox-aar-${{ env.TARGET_ARCH }}
          path: sing-box/libbox.aar
          if-no-files-found: error
